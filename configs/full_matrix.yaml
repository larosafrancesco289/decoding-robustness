# Full matrix (the main study). Design frozen 2026-06-02.
#
# RQ (reframed from the pilot): *is the temperature-robustness ranking of decoding
# strategies STABLE across quantization, and how large is the quant effect?* The pilot
# showed the headline temperature effect is huge (well-powered at N=50) while the quant
# effect is small (~5pp, unpowerable as an interaction), so the contribution is the
# CROSS-MODEL stability result, which is why this matrix spans 5 model families/sizes.
#
# Run on a Slurm cluster (scripts/slurm/). For 4-wide array parallelism, target
# one (model,quant) per task with run_pilot.py --only-model / --only-quant.

name: full-matrix-phase1
phase: phase1
output_dir: results/full_matrix

# Five family/size points. Llama is the canary (validated in the pilot); Mistral adds a
# second 7-8B family; the three Qwen3 sizes are the size axis. All Bartowski imatrix GGUFs;
# filenames + SHA256 in DOWNLOADS.md and the per-file .meta.json sidecars.
checkpoints:
  - name: llama-3.1-8b-instruct
    family: llama
    params_b: 8.0
    hf_repo: bartowski/Meta-Llama-3.1-8B-Instruct-GGUF
    quant_files:
      Q8_0: Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
      Q6_K: Meta-Llama-3.1-8B-Instruct-Q6_K.gguf
      Q4_K_M: Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
      Q3_K_M: Meta-Llama-3.1-8B-Instruct-Q3_K_M.gguf

  - name: mistral-7b-instruct-v0.3
    family: mistral
    params_b: 7.0
    hf_repo: bartowski/Mistral-7B-Instruct-v0.3-GGUF
    quant_files:
      Q8_0: Mistral-7B-Instruct-v0.3-Q8_0.gguf
      Q6_K: Mistral-7B-Instruct-v0.3-Q6_K.gguf
      Q4_K_M: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
      Q3_K_M: Mistral-7B-Instruct-v0.3-Q3_K_M.gguf

  - name: qwen3-8b
    family: qwen3
    params_b: 8.0
    hf_repo: bartowski/Qwen_Qwen3-8B-GGUF
    quant_files:
      Q8_0: Qwen_Qwen3-8B-Q8_0.gguf
      Q6_K: Qwen_Qwen3-8B-Q6_K.gguf
      Q4_K_M: Qwen_Qwen3-8B-Q4_K_M.gguf
      Q3_K_M: Qwen_Qwen3-8B-Q3_K_M.gguf

  - name: qwen3-4b
    family: qwen3
    params_b: 4.0
    hf_repo: bartowski/Qwen_Qwen3-4B-GGUF
    # BF16 = the unquantized anchor (Qwen3-4B only), the "no quantization" reference point
    # for the stability claim. Other models have no BF16 file, so the matrix skips it for them.
    quant_files:
      BF16: Qwen_Qwen3-4B-bf16.gguf
      Q8_0: Qwen_Qwen3-4B-Q8_0.gguf
      Q6_K: Qwen_Qwen3-4B-Q6_K.gguf
      Q4_K_M: Qwen_Qwen3-4B-Q4_K_M.gguf
      Q3_K_M: Qwen_Qwen3-4B-Q3_K_M.gguf

  # Generation control (added 2026-06-04): same family as qwen3-8b, one generation older.
  # Tests whether temperature-robustness is a model-GENERATION property (Qwen2.5 has no
  # thinking mode; enable_thinking=False is ignored by its template). Aimed at arXiv:2601.00942.
  - name: qwen2.5-7b-instruct
    family: qwen2.5
    params_b: 7.6
    hf_repo: bartowski/Qwen2.5-7B-Instruct-GGUF
    quant_files:
      Q8_0: Qwen2.5-7B-Instruct-Q8_0.gguf
      Q6_K: Qwen2.5-7B-Instruct-Q6_K.gguf
      Q4_K_M: Qwen2.5-7B-Instruct-Q4_K_M.gguf
      Q3_K_M: Qwen2.5-7B-Instruct-Q3_K_M.gguf

  - name: qwen3-1.7b
    family: qwen3
    params_b: 1.7
    hf_repo: bartowski/Qwen_Qwen3-1.7B-GGUF
    quant_files:
      Q8_0: Qwen_Qwen3-1.7B-Q8_0.gguf
      Q6_K: Qwen_Qwen3-1.7B-Q6_K.gguf
      Q4_K_M: Qwen_Qwen3-1.7B-Q4_K_M.gguf
      Q3_K_M: Qwen_Qwen3-1.7B-Q3_K_M.gguf

  # Cross-vendor disambiguator (added 2026-06-04). Qwen2.5 turned out robust like Qwen3, so
  # the "generation-bound" framing collapses to "Qwen-lineage robust, Llama-3.1 fragile",
  # n=1 per camp. Gemma-3 is a MODERN, non-Qwen, non-Llama vendor: if it's robust too, the
  # finding generalises to "modern models are temperature-robust, Llama-3.1 is the early-
  # fragile outlier" (cross-vendor). If it collapses, the claim shrinks to Qwen-specific.
  # 12B at parallel=4/n_ctx=12288 (VRAM headroom on the 16GB 5070 Ti); thinking-OFF (no mode).
  - name: gemma-3-12b-it
    family: gemma3
    params_b: 12.0
    hf_repo: bartowski/google_gemma-3-12b-it-GGUF
    quant_files:
      Q8_0: google_gemma-3-12b-it-Q8_0.gguf
      Q6_K: google_gemma-3-12b-it-Q6_K.gguf
      Q4_K_M: google_gemma-3-12b-it-Q4_K_M.gguf
      Q3_K_M: google_gemma-3-12b-it-Q3_K_M.gguf

# BF16 first so the Qwen3-4B anchor runs; the other four apply to every checkpoint. The
# matrix skips (model,quant) pairs whose GGUF isn't present (so BF16 is a no-op except 4B).
quant_levels: [BF16, Q8_0, Q6_K, Q4_K_M, Q3_K_M]

# Same decoding grid as the pilot. Classic methods at llama.cpp defaults; the two
# method-defining samplers at their papers' recommended values; two temperature-LAST arms for
# the min-p-critique ("fair fight") ablation (arXiv:2506.13681). See pilot_llama.yaml for the
# per-value rationale.
samplers:
  - method: greedy
  - method: temperature
  - method: top_p
    top_p: 0.95
  - method: top_k
    top_k: 40
  - method: min_p
    min_p: 0.05
  - method: top_n_sigma
    top_n_sigma: 1.0
  - method: min_p
    min_p: 0.05
    chain: [min_p, temperature]
  - method: top_p
    top_p: 0.95
    chain: [top_p, temperature]

temperatures: [0.7, 1.0, 1.3]

# Two discriminative tasks. GPQA-Diamond dropped: near-chance for an 8B model (greedy ≈ 26%
# vs 25% random), so it carries little ranking signal and is the most parse-fail-prone + most
# expensive task. GSM8K (reasoning) + MMLU-Pro (broad knowledge) both discriminate cleanly.
tasks:
  - name: gsm8k
    hf_dataset: openai/gsm8k
    hf_config: main
    revision: main          # exact items and prompts are logged per record
    split: test
    subset_size: 50
    max_new_tokens: 512
    parser: gsm8k_numeric

  - name: mmlu_pro
    hf_dataset: TIGER-Lab/MMLU-Pro
    revision: main
    split: test
    subset_size: 50
    max_new_tokens: 1024
    parser: mmlu_pro_letter

generation:
  global_seed: 0
  repetitions: 3            # K=3 stochastic samples/item (greedy stays K=1, deterministic).
                            # The power analysis: N=50 nails the headline; reps reduce sampling
                            # noise for the stochastic comparisons. See scripts/power_analysis.py.

server:
  host: 127.0.0.1
  port: 8080                # on shared Slurm nodes, derive from $SLURM_ARRAY_TASK_ID
  llama_cpp_commit: 5aba5364d959756c43eccc45596731e7b4eb3aa4  # CLUSTER build (sm_75/86/90); pinned == pilot's commit
  n_ctx: 16384              # ~2048/slot at parallel=8. Qwen3 runs thinking-OFF (loop passes
                            # enable_thinking=False), so outputs stay short and fit this budget.
  n_gpu_layers: -1
  parallel: 8               # throughput lever. On 11GB cards (2080 Ti) drop to ~4 and/or lower
                            # n_ctx, or route the 8B Q8 to a larger-VRAM GPU.
