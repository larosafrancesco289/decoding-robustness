# Cliff-edge temperature ladder (2026-06-10) — the one non-tautological high-T experiment
# Question: WHERE does each model's cliff sit in the
# 1.3–2.0 band, per sampler? The matrix showed Llama dead by 1.3 while Gemma survived 1.5
# in the smoke; T=2–3 is mechanically trivial (softmax ~uniform). The signal is the gradient
# between 1.3 and 2.0, with full N + bootstrap CIs.
#
# Design: 3 models spanning fragile -> robust across vendors (Llama-3.1 fragile, Qwen2.5
# robust mid, Gemma-3 robust); Q8 only (quant held fixed); the 4 head-to-head samplers;
# T = 1.3 / 1.5 / 1.7 / 2.0 (1.3 overlaps the matrix as the anchor rung, 2.0 overlaps the
# smoke); both tasks, frozen N=50 head subsets (same items as the matrix, paired); K=3.
# No greedy arm — the matrix Q8 greedy cells are the T=0 anchor and join in analysis.
# 4800 records/model, 14,400 total. Separate output_dir; ids never mix with the matrix.

name: cliff-ladder
phase: cliff_ladder
output_dir: results/cliff_ladder

checkpoints:
  - name: llama-3.1-8b-instruct
    family: llama
    params_b: 8.0
    hf_repo: bartowski/Meta-Llama-3.1-8B-Instruct-GGUF
    quant_files:
      Q8_0: Meta-Llama-3.1-8B-Instruct-Q8_0.gguf

  - name: qwen2.5-7b-instruct
    family: qwen2.5
    params_b: 7.6
    hf_repo: bartowski/Qwen2.5-7B-Instruct-GGUF
    quant_files:
      Q8_0: Qwen2.5-7B-Instruct-Q8_0.gguf

  - name: gemma-3-12b-it
    family: gemma3
    params_b: 12.0
    hf_repo: bartowski/google_gemma-3-12b-it-GGUF
    quant_files:
      Q8_0: google_gemma-3-12b-it-Q8_0.gguf

quant_levels: [Q8_0]

samplers:
  - method: temperature
  - method: top_p
    top_p: 0.95
  - method: min_p
    min_p: 0.05
  - method: top_n_sigma
    top_n_sigma: 1.0

temperatures: [1.3, 1.5, 1.7, 2.0]

tasks:
  - name: gsm8k
    hf_dataset: openai/gsm8k
    hf_config: main
    revision: main
    split: test
    subset_size: 50
    max_new_tokens: 512
    parser: gsm8k_numeric

  - name: mmlu_pro
    hf_dataset: TIGER-Lab/MMLU-Pro
    revision: main
    split: test
    subset_size: 50
    max_new_tokens: 1024
    parser: mmlu_pro_letter

generation:
  global_seed: 0
  repetitions: 3

server:
  host: 127.0.0.1
  port: 8080
  llama_cpp_commit: 5aba5364d959756c43eccc45596731e7b4eb3aa4
  n_ctx: 16384
  n_gpu_layers: -1
  parallel: 8
