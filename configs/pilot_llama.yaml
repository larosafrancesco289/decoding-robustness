# Phase-0 pilot (SPEC §4.4, milestone M3).
# Single canary model (Llama-3.1-8B-Instruct) across the full quant ladder and decoding
# grid, on a small per-task subset. Purpose: validate the pipeline, measure throughput,
# and produce the first sampler×quant table before committing to the full matrix.
#
# NOTE: dataset revisions are "main" and quant_files are empty until M1/M2 pins them
# (open TODOs in SPEC §12). Do not treat this as the pre-registered Phase-1 config.

name: pilot-llama-phase0
phase: pilot
output_dir: results/pilot_llama

checkpoints:
  - name: llama-3.1-8b-instruct
    family: llama
    params_b: 8.0
    hf_repo: bartowski/Meta-Llama-3.1-8B-Instruct-GGUF
    # Bartowski's imatrix GGUF filenames. Verify with `huggingface-cli download --list` or
    # the repo file listing before the main run; SHA256 is pinned by scripts/fetch_models.py.
    quant_files:
      Q8_0: Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
      Q6_K: Meta-Llama-3.1-8B-Instruct-Q6_K.gguf
      Q4_K_M: Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
      Q3_K_M: Meta-Llama-3.1-8B-Instruct-Q3_K_M.gguf

quant_levels: [Q8_0, Q6_K, Q4_K_M, Q3_K_M]

# Each method at its source-justified default (SPEC §4.2); temperature is swept separately.
# Rationale: classic samplers use the llama.cpp engine defaults (the values the practical
# user base actually runs, corroborated by the origin papers); the two method-defining
# samplers use the value their introducing paper recommends.
samplers:
  - method: greedy            # deterministic argmax anchor (T=0)
  - method: temperature       # pure temperature scaling, no truncation
  - method: top_p
    top_p: 0.95               # llama.cpp default; matches Holtzman et al. 2020 (nucleus sampling)
  - method: top_k
    top_k: 40                 # llama.cpp default (HuggingFace default is 50)
  - method: min_p
    min_p: 0.05               # llama.cpp default; low end of Nguyen et al. 2024 (0.05-0.1)
  - method: top_n_sigma
    top_n_sigma: 1.0          # Tang et al. 2024: stated robust, tuning-free default
  # Sampler-chain ordering arms (pre-registered M3 decision). The DEFAULT chain above is
  # temperature-FIRST — faithful to how the min_p/top-nσ papers were evaluated (HuggingFace
  # order), and the order min_p needs to adapt to temperature. The two arms below apply
  # temperature LAST (llama.cpp's native default): the "fair fight" test of whether min_p
  # still beats top_p once top_p gets the ordering that protects it at high T — directly
  # probing the min-p critique (arXiv:2506.13681). top-nσ and top_k are ~order-invariant,
  # so only top_p and min_p get a second arm. Labelled '..._tlast' (see SamplerSpec.label).
  - method: min_p
    min_p: 0.05
    chain: [min_p, temperature]
  - method: top_p
    top_p: 0.95
    chain: [top_p, temperature]

# Stochastic-method temperature grid (greedy is handled at T=0 automatically).
temperatures: [0.7, 1.0, 1.3]

tasks:
  - name: gsm8k
    hf_dataset: openai/gsm8k
    hf_config: main
    revision: main          # TODO: pin to a specific commit before Phase 1
    split: test
    subset_size: 50
    max_new_tokens: 512
    parser: gsm8k_numeric

  - name: mmlu_pro
    hf_dataset: TIGER-Lab/MMLU-Pro
    revision: main          # TODO: pin
    split: test
    subset_size: 50
    max_new_tokens: 1024
    parser: mmlu_pro_letter

  - name: gpqa_diamond
    hf_dataset: Idavidrein/gpqa
    hf_config: gpqa_diamond
    revision: main          # TODO: pin
    split: train            # GPQA ships its labeled set under the train split
    subset_size: 50
    max_new_tokens: 1536    # GPQA's quantitative derivations are long; 1024 was hit (pilot
                            # smoke). Fits the 2048/slot budget (max prompt ~412 + 1536).
    parser: gpqa_letter

generation:
  global_seed: 0
  repetitions: 1

server:
  host: 127.0.0.1
  port: 8080
  llama_cpp_commit: 5aba5364d959756c43eccc45596731e7b4eb3aa4  # built with CUDA (sm_120) at M1
  n_ctx: 16384              # total context shared across slots -> ~2048/slot at parallel=8.
                            # MUST exceed prompt + max_new_tokens per slot: the MC tasks set
                            # max_new_tokens=1024, and at the old 8192 (1024/slot) GPQA's long
                            # reasoning was truncated mid-derivation before it emitted the
                            # answer (33% parse-fail even at greedy). 2048/slot fixes it.
  n_gpu_layers: -1
  parallel: 8               # batched serving = the throughput lever (SPEC §8); the client
                            # keeps this many completions in flight. Seed-logged but not
                            # bit-exact (SPEC §7.3) — accepted for the pilot.
