# Qwen3-8B thinking-ON spot-check (added 2026-06-04). NOT part of the frozen matrix.
# Purpose: the matrix runs Qwen3 thinking-OFF and finds it temperature-robust. A reviewer can
# object that the robustness is an artifact of disabling thinking, OR that it's "active
# deliberation" doing the work (the test-time-scaling line: reasoning flattens the temperature
# lever). This checks whether the robustness survives with thinking ON.
# Run with: run_pilot.py --config configs/qwen3_thinking_spotcheck.yaml --enable-thinking
#   --model-dir models --out results/thinking_spotcheck/qwen3-8b-thinkON__Q8_0.jsonl
# Separate --out so the thinking-ON records don't collide with the matrix's thinking-OFF ids
# (the record id has no thinking field). Lean grid: pure temperature vs min_p at T0.7 vs T1.3.
name: qwen3-thinking-spotcheck
phase: thinking_spotcheck
output_dir: results/thinking_spotcheck

checkpoints:
  - name: qwen3-8b
    family: qwen3
    params_b: 8.2
    hf_repo: bartowski/Qwen_Qwen3-8B-GGUF
    quant_files:
      Q8_0: Qwen_Qwen3-8B-Q8_0.gguf

quant_levels: [Q8_0]

# Lean: the contrast that matters is pure temperature (the "should collapse" arm) vs min_p
# (the "robust truncation" arm), at the low/high temperature endpoints. greedy = K=1 anchor.
samplers:
  - method: greedy
  - method: temperature
  - method: min_p
    min_p: 0.05

temperatures: [0.7, 1.3]

# Bigger max_new_tokens than the matrix (512/1024): thinking traces are long. The per-slot
# budget (n_ctx/parallel = 20480/4 = 5120) must exceed prompt + max_new_tokens (~800 + 3072).
tasks:
  - name: gsm8k
    hf_dataset: openai/gsm8k
    hf_config: main
    revision: main
    split: test
    subset_size: 25
    max_new_tokens: 3072
    parser: gsm8k_numeric

  - name: mmlu_pro
    hf_dataset: TIGER-Lab/MMLU-Pro
    revision: main
    split: test
    subset_size: 25
    max_new_tokens: 3072
    parser: mmlu_pro_letter

generation:
  global_seed: 0
  repetitions: 2            # K=2 (spot-check; the matrix uses 3)

server:
  host: 127.0.0.1
  port: 8080
  llama_cpp_commit: 5aba5364d959756c43eccc45596731e7b4eb3aa4
  n_ctx: 20480              # 5120/slot at parallel=4, room for long thinking traces
  n_gpu_layers: -1
  parallel: 4              # lower than the matrix's 8 to widen the per-slot context budget
