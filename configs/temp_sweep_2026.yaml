# Temperature-axis sweep on four models chosen 2026-09-06 (author's decision; research in
# tmp/model-research-2026-09-06.md). Question: is Llama-3.x's collapse under plain temperature sampling
# a lone case? Hermes-3 shares the fragile Llama-3.1-8B base with different post-training (base or
# post-training?); Qwen3.5-9B and Gemma-4-E4B-it are the two most downloaded small models of 2026;
# OLMo-3-7B is fully open. Same shape as llama_lineage.yaml: greedy + plain temperature at the grid's
# temperatures, Q8_0, K=3, the frozen head-of-split N=50 panels so every cell sits next to Table 1.
# Prespecified flag (frozen before the run): accuracy drop T0.7->T1.3 >= 15 pp, or cap-hit rise >= 20 pp,
# or strict-parse fall >= 20 pp, on either task; a flagged model gets the full 8-arm grid at Q8.
# llama.cpp: v0.4.0 (2026-09-04 release), needed by Gemma 4 and Qwen3.5; Llama-3.2-3B and Qwen3-4B are
# rerun on this commit as the bridge to the paper's pinned 5aba5364 (configs/bridge_v040.yaml).
# Thinking modes: Qwen3.5 small dense checkpoints default to reasoning off; Gemma 4 is rendered with
# enable_thinking=False (the runner passes it; verify on the smoke test that no <|think|> block appears).

name: temp-sweep-2026
phase: temp_sweep_2026
output_dir: results/temp_sweep_2026

checkpoints:
  - name: hermes-3-llama-3.1-8b
    family: llama
    params_b: 8.0
    hf_repo: bartowski/Hermes-3-Llama-3.1-8B-GGUF
    quant_files:
      Q8_0: Hermes-3-Llama-3.1-8B-Q8_0.gguf

  - name: qwen3.5-9b
    family: qwen3.5
    params_b: 9.0
    hf_repo: bartowski/Qwen_Qwen3.5-9B-GGUF
    quant_files:
      Q8_0: Qwen_Qwen3.5-9B-Q8_0.gguf

  - name: gemma-4-e4b-it
    family: gemma4
    params_b: 8.0
    hf_repo: bartowski/google_gemma-4-E4B-it-GGUF
    quant_files:
      Q8_0: google_gemma-4-E4B-it-Q8_0.gguf

  - name: olmo-3-7b-instruct
    family: olmo3
    params_b: 7.0
    hf_repo: bartowski/allenai_Olmo-3-7B-Instruct-GGUF
    quant_files:
      Q8_0: allenai_Olmo-3-7B-Instruct-Q8_0.gguf

quant_levels: [Q8_0]

samplers:
  - method: greedy
  - method: temperature

temperatures: [0.7, 1.0, 1.3]

tasks:
  - name: gsm8k
    hf_dataset: openai/gsm8k
    hf_config: main
    revision: main
    split: test
    subset_size: 50
    max_new_tokens: 512
    parser: gsm8k_numeric

  - name: mmlu_pro
    hf_dataset: TIGER-Lab/MMLU-Pro
    revision: main
    split: test
    subset_size: 50
    max_new_tokens: 1024
    parser: mmlu_pro_letter

generation:
  global_seed: 0
  repetitions: 3

server:
  host: 127.0.0.1
  port: 8080
  llama_cpp_commit: 427291b5b34cd914a31b3fd3b61a68f6184f4b9f   # PLACEHOLDER: replace with the commit the v0.4.0 build prints
  n_ctx: 16384
  n_gpu_layers: -1
  parallel: 8
