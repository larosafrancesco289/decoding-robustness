[project]
name = "decoding-robustness"
version = "0.1.0"
description = "Temperature robustness of decoding strategies across model families, quantization levels, and tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",   # native /completion client
    "jinja2>=3.1",   # client-side chat-template rendering
    "datasets>=2.20",  # task dataset loading
]

# Heavier deps are optional extras below; the base env stays lean.

[project.optional-dependencies]
# Only scripts/fetch_models.py needs these (model download + GGUF metadata read).
# Install with: uv sync --extra fetch
fetch = [
    "huggingface-hub>=0.24",
    "gguf>=0.10",
]
# Figure generation (scripts/make_figures.py). Install with: uv sync --extra figures
figures = [
    "matplotlib>=3.9",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decoding_robustness"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
